name: Verificar Brasil Notícias
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: node scripts/release-tests.mjs
      - run: node scripts/validate-artifact.mjs
      - run: python3 scripts/validate-plugin.py
